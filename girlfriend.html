<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Girlfriend ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;

body{

    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ffd6e7,#ffeef5,#fff);
    text-align:center;
}

.container{
    width:90%;
    max-width:650px;
}

img{
    width:100%;
    border-radius:20px;
    box-shadow:0 15px 35px rgba(0,0,0,.2);
}

h2{
    margin:25px 0 10px;
    color:#ff4f81;
    font-size:34px;
}

p{
    color:#666;
    font-size:18px;
    margin-bottom:25px;
    line-height:1.6;
}

button{
    padding:15px 35px;
    border:none;
    border-radius:50px;
    background:#ff5c8a;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:scale(1.08);
}
</style>
</head>

<div class="container">

<img src="girlfriend.jpg" alt="My Girlfriend">

</button>

</div>

<audio id="bgMusic" loop>
