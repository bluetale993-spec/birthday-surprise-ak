<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preparing Something Special ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
    font-family:Arial,sans-serif;
    color:white;
    background:linear-gradient(-45deg,#ff758c,#ff7eb3,#8e44ad,#6a11cb);
    background-size:400% 400%;
    animation:bgMove 10s ease infinite;
}

.container{
    text-align:center;
}

.heart{
    font-size:90px;
    animation:beat 1s infinite;
}

h1{
    margin-top:20px;
    font-size:32px;
}

p{
    margin-top:10px;
    font-size:18px;
    opacity:.9;
}

.loading-bar{
    width:260px;
    height:10px;
    background:rgba(255,255,255,.3);
    border-radius:20px;
    margin:30px auto;
    overflow:hidden;
}

.loading-fill{
    width:0%;
    height:100%;
    background:white;
    animation:load 3s linear forwards;
}

@keyframes beat{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.2);}
}

@keyframes load{
    from{width:0%;}
    to{width:100%;}
}

@keyframes bgMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}
</style>
</head>

<body>

<div class="container">
    <div class="heart">❤️</div>
    <h1>Preparing Something Special...</h1>
    <p>Made with all mah love for uh 💖</p>

    <div class="loading-bar">
        <div class="loading-fill"></div>
    </div>
</div>

<script>
setTimeout(function(){
    window.location.href="welcome.html";
},3000);
</script>

</body>
</html>
