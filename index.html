<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#060818,#1d1147,#5b1b8f);
    color:white;
}

.card{
    width:90%;
    max-width:700px;
    text-align:center;
    background:rgba(255,255,255,.1);
    backdrop-filter:blur(18px);
    padding:40px;
    border-radius:25px;
    box-shadow:0 0 30px rgba(255,255,255,.2);
    animation:fadeIn 1.5s ease;
}

h1{
    font-size:42px;
    margin-bottom:20px;
}

p{
    font-size:20px;
    line-height:1.7;
    margin-bottom:30px;
}

button{
    padding:15px 35px;
    font-size:18px;
    border:none;
    border-radius:12px;
    background:#ff4f81;
    color:white;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:scale(1.08);
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

#bgMusic{
    display:none;
}
</style>
</head>

<body>

<audio id="bgMusic" loop>
    <source src="kangal-irandal.mp3" type="audio/mpeg">
</audio>

<div class="card">
    <h1>🎂 Happy Birthday ❤️</h1>

    <p>
        I made something special just for uh... 💖<br>
        Press the button below and let the journey begin.
    </p>

    <button id="startBtn">🎁 Open Your Gift</button>
</div>

<script>
const music = document.getElementById("bgMusic");

document.getElementById("startBtn").addEventListener("click", async () => {
    try{
        await music.play();
    }catch(e){}

    sessionStorage.setItem("musicPlaying","true");
    window.location.href = "loading.html";
});
</script>

<script src="music.js"></script>
<script src="effects.js"></script>

</body>
</html>
